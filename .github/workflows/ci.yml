name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint, Type-Check, Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        bun-version: ['1.1.x', 'latest']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Build all packages
        run: bun run build

      - name: Run unit tests
        run: bun run test
        env:
          DB_DRIVER: sqlite
          DB_PATH: ':memory:'
          JWT_SECRET: test-secret-key-that-is-at-least-32-chars!!
          APP_ENV: test

      - name: Run integration tests
        run: bun run test:integration
        env:
          DB_DRIVER: sqlite
          DB_PATH: ./tmp-ci.sqlite
          JWT_SECRET: test-secret-key-that-is-at-least-32-chars!!
          APP_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.bun-version }}
          path: '**/coverage/**'
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit || echo "::warning::Audit found issues — review before merge"

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Check bundle sizes (warn if any page > 500KB)
        run: |
          echo "Bundle size check placeholder — xaocs analyze not run in CI without views dir"
