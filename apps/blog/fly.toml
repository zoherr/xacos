app = "xaocs-blog-demo"
primary_region = "iad"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  APP_ENV = "production"
  APP_PORT = "5000"
  DB_DRIVER = "sqlite"
  DB_PATH = "/data/blog.sqlite"

[mounts]
  source = "blog_data"
  destination = "/data"

[[services]]
  internal_port = 5000
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
